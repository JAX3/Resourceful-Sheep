modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/JAX3/resourceful-sheep/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/JAX3/resourceful-sheep"
authors="JAX3"
description='''
Feed sheep blocks, ingots and gems to infuse their wool, shear them for resource wool, and process it in the FE-powered Mechanical Separator. Fully data-driven with JEI support.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: recipe viewer integration. The mod works without JEI.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[31,)"
    ordering="NONE"
    side="CLIENT"
